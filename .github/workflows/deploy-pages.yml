name: Deploy GitHub Pages

# Publica el sitio en GitHub Pages en cada push a main.
# scripts/freeze.py renderiza la app Flask (backend/) a HTML estático --
# es la única fuente de verdad: no hay que mantener un mirror aparte.
#
# Requisito único en el repo: Settings → Pages → Build and deployment
# → Source: "GitHub Actions" (no "Deploy from a branch").
#
# Nota de tamaño: el repo incluye ~45 canciones (~134 MB en total,
# recomprimidas a 128kbps). GitHub Pages soporta sitios de hasta 1 GB,
# así que vamos sobrados, pero ten en cuenta que el repo pesa por eso
# más que un proyecto típico.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias del backend
        run: pip install -r backend/requirements.txt

      - name: Congelar el sitio a HTML estático
        run: python scripts/freeze.py site

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
