<section class="section section--muted" id="contact">
  <div class="section__inner section__inner--narrow">
    <p class="eyebrow">// contacto</p>
    <h2 class="section__title">Hablemos de tu proyecto</h2>
    <p class="section__lead">
      Escríbeme y te respondo en cuanto pueda. También puedes encontrarme en redes.
    </p>

    <form id="contactForm" class="contact-form reveal-up" novalidate>
      <div class="form-group">
        <label for="name">Nombre</label>
        <input type="text" id="name" name="name" autocomplete="name" required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>

      <div class="form-group">
        <label for="message">Mensaje</label>
        <textarea id="message" name="message" rows="5" required></textarea>
      </div>

      <button type="submit" class="btn btn--primary">Enviar mensaje</button>
      <p class="contact-form__status" id="contactStatus" role="status" aria-live="polite"></p>
    </form>
  </div>
</section>
