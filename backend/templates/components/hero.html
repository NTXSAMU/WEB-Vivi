<section class="hero" id="hero">
  <canvas id="particlesCanvas" class="hero__particles" aria-hidden="true"></canvas>

  <div class="hero__content">
    <p class="eyebrow">{{ content.hero.eyebrow }}</p>
    <h1 class="hero__title">{{ content.hero.title }}</h1>
    <p class="hero__subtitle">{{ content.hero.subtitle }}</p>

    <div class="hero__actions">
      <a href="{{ content.hero.cta_primary.href }}" class="btn btn--primary">{{ content.hero.cta_primary.label }}</a>
      <a href="{{ content.hero.cta_secondary.href }}" class="btn btn--ghost">{{ content.hero.cta_secondary.label }}</a>
    </div>
  </div>

  <a href="#carta" class="hero__scroll" aria-label="Bajar a la siguiente sección">
    <span></span>
    scroll
  </a>
</section>
