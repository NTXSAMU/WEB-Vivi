{% if playlist %}
<div class="player-bar" id="playerBar">
  <div class="player-bar__panel" id="playerBarPanel">
    <p class="player-bar__title" id="barNowTitle">Elige una canción</p>
    <p class="player-bar__artist" id="barNowArtist">&nbsp;</p>

    <div class="player-bar__controls">
      <button id="barShuffle" class="icon-btn" type="button" aria-label="Orden aleatorio" aria-pressed="false">🔀</button>
      <button id="barPrev" class="icon-btn" type="button" aria-label="Anterior">⏮</button>
      <button id="barPlayBtn" class="player-bar__play" type="button" aria-label="Reproducir">
        <svg class="icon-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,4 20,12 6,20"/></svg>
        <svg class="icon-pause" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" hidden><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </button>
      <button id="barNext" class="icon-btn" type="button" aria-label="Siguiente">⏭</button>
    </div>

    <input type="range" id="barVolume" class="player-bar__volume-slider" min="0" max="100" value="70" aria-label="Volumen">
  </div>

  <button class="player-bar__toggle" id="playerBarToggle" type="button" aria-label="Mostrar controles de música" aria-expanded="false">
    <svg class="icon-vol-on" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    <svg class="icon-vol-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" hidden><path d="M11 5 6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
  </button>
</div>
{% endif %}
