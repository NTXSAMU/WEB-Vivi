{% if playlist %}
<div class="player-bar" id="playerBar">
  <div class="player-bar__info">
    <p class="player-bar__title" id="barNowTitle">Elige una canción</p>
    <p class="player-bar__artist" id="barNowArtist">&nbsp;</p>
  </div>

  <div class="player-bar__center">
    <div class="player-bar__controls">
      <button id="barShuffle" class="player-bar__icon-btn" type="button" aria-label="Orden aleatorio" aria-pressed="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
      </button>
      <button id="barPrev" class="player-bar__icon-btn" type="button" aria-label="Anterior">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="19,20 9,12 19,4"/><rect x="5" y="4" width="2" height="16"/></svg>
      </button>
      <button id="barPlayBtn" class="player-bar__play" type="button" aria-label="Reproducir">
        <svg class="icon-play" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,4 20,12 6,20"/></svg>
        <svg class="icon-pause" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" hidden><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </button>
      <button id="barNext" class="player-bar__icon-btn" type="button" aria-label="Siguiente">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,4 15,12 5,20"/><rect x="17" y="4" width="2" height="16"/></svg>
      </button>
    </div>
    <div class="player-bar__progress">
      <span class="player-bar__time" id="barCurrentTime">0:00</span>
      <input type="range" id="barSeek" class="player-bar__seek" min="0" max="100" value="0" step="0.1" aria-label="Progreso de la canción">
      <span class="player-bar__time" id="barDuration">0:00</span>
    </div>
  </div>

  <div class="player-bar__volume">
    <button id="playerBarMute" class="player-bar__icon-btn" type="button" aria-label="Silenciar">
      <svg class="icon-vol-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      <svg class="icon-vol-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" hidden><path d="M11 5 6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
    </button>
    <input type="range" id="barVolume" class="player-bar__volume-slider" min="0" max="100" value="70" aria-label="Volumen">
  </div>
</div>
{% endif %}
